name = "grant-manager-tool-demo-test"
main = "worker.js"
compatibility_date = "2024-05-29"

# Miniflare in-process bindings for tests — no real KV/D1/AI needed
[[kv_namespaces]]
binding = "USER_PROFILES"
id = "test-user-profiles"

[[kv_namespaces]]
binding = "LOGIN_ATTEMPTS"
id = "test-login-attempts"

[[kv_namespaces]]
binding = "FEEDBACK_RATE_LIMIT"
id = "test-feedback-rate-limit"

[[r2_buckets]]
binding = "FEEDBACK_ATTACHMENTS"
bucket_name = "test-feedback-attachments"

[vars]
GITHUB_TOKEN = "test-github-token"
FEEDBACK_R2_PUBLIC_BASE_URL = "https://test-r2.example.com"

[[d1_databases]]
binding = "GRANT_MANAGER_DB"
database_name = "grant-manager-test"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[[queues.producers]]
binding = "NOTIFY_QUEUE"
queue = "test-notify-queue"

[ai]
binding = "AI"
