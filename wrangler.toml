name = "grant-manager-tool-demo"
main = "worker.js"
compatibility_date = "2024-05-29"
workers_dev = true

assets = { directory = "ui/dist", not_found_handling = "single-page-application", binding = "ASSETS" }

[[routes]]
pattern = "grantmatch.dev"
custom_domain = true

[[routes]]
pattern = "www.grantmatch.dev"
custom_domain = true

[build]
command = "cd ui && npm install && npm run build"

[vars]
# Comma-separated usernames allowed to use admin features (CSV grant upload).
# Defaults to "demo" when unset.
ADMIN_USERS = "demo,asialakay"
# Score threshold (0–10) used by the profile matcher worker.
SCORE_THRESHOLD = "6.0"

[[kv_namespaces]]
binding = "USER_PROFILES"
id = "3613c184af7d4890a70f1c9d28583329"

[[kv_namespaces]]
binding = "LOGIN_ATTEMPTS"
id = "713c8d1d9eb34d1ea13656bf40f14ccc"

[[kv_namespaces]]
binding = "FEEDBACK_RATE_LIMIT"
id = "786a52996c0b4ad4884a48fd10d65d82"

[[r2_buckets]]
binding = "FEEDBACK_ATTACHMENTS"
bucket_name = "foundationplanner-feedback-attachments"

[[d1_databases]]
binding = "GRANT_MANAGER_DB"
database_name = "grant-manager-db"
database_id = "e99396be-8043-41f6-9762-07c2b6fc4d3f"
migrations_dir = "migrations"

[triggers]
# Daily Simpler Grants.gov full-catalog sync (syncGrantsWithD1, worker.js scheduled()).
# Runs before the profile_matcher worker's 0 8 * * * cron (workers/profile_matcher_wrangler.toml)
# so notification scoring sees same-day data. Was previously unwired — scheduled() existed
# but nothing ever triggered it.
crons = ["0 7 * * *"]

[ai]
binding = "AI"

[observability.logs]
enabled = true

# Set via: wrangler secret put SIMPLER_GRANTS_API_KEY
# Get a key at: https://simpler.grants.gov/developer
# Without this secret, /api/live-search returns 503.
