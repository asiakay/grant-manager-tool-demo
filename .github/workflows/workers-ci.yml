name: Cloudflare Workers CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'worker.js'
      - 'wrangler.toml'
  pull_request:
    branches: [main]
    paths:
      - 'worker/**'
      - 'worker.js'
      - 'wrangler.toml'
  workflow_dispatch:

jobs:
  # ── Validate on every PR ──────────────────────────────────────────────────
  validate:
    name: Type-check & dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install worker deps
        working-directory: worker
        run: npm ci

      - name: TypeScript type-check
        working-directory: worker
        run: npx tsc --noEmit

      - name: Wrangler dry-run (validate config)
        working-directory: worker
        run: npx wrangler deploy --dry-run --outdir /tmp/worker-build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # ── Deploy only on push to main ───────────────────────────────────────────
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://grant-demo.workers.dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install worker deps
        working-directory: worker
        run: npm ci

      - name: Apply D1 migrations
        working-directory: worker
        run: npx wrangler d1 migrations apply EQORE_DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        continue-on-error: true

      - name: Deploy worker
        working-directory: worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
