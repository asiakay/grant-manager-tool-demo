name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run scoring unit tests (pytest)
        run: python -m pytest tests/ -v

      - name: Run worker tests (vitest)
        run: npm run test:worker

  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build UI
        working-directory: ui
        run: npm ci && npm run build

      - name: Apply D1 migrations
        working-directory: .
        run: npm ci && npx wrangler d1 migrations apply grant-manager-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Create notification queue (idempotent)
        # Must run before any worker that binds NOTIFY_QUEUE is deployed.
        # wrangler exits 1 if the queue already exists; || echo treats that as success.
        run: npx wrangler queues create grant-notify-queue || echo "Queue already exists — continuing"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy main worker
        working-directory: .
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set worker secrets
        # `wrangler secret bulk` sets all secrets in one atomic operation against
        # the already-deployed version. Sequential `secret put` calls each create
        # and immediately deploy a new version, causing the second call to fail
        # with "latest version isn't currently deployed". `versions secret put`
        # avoids that error but creates undeployed versions that the live worker
        # never sees — so secrets were silently never applied.
        run: |
          SECRETS=$(jq -n \
            --arg account_id "$CLOUDFLARE_ACCOUNT_ID" \
            --arg ai_token "$CLOUDFLARE_API_TOKEN" \
            '{"CF_ACCOUNT_ID": $account_id, "CF_AI_TOKEN": $ai_token}')
          if [ -n "$SIMPLER_GRANTS_API_KEY" ]; then
            SECRETS=$(echo "$SECRETS" | jq --arg key "$SIMPLER_GRANTS_API_KEY" '. + {"SIMPLER_GRANTS_API_KEY": $key}')
          else
            echo "SIMPLER_GRANTS_API_KEY repo secret not set — skipping (live search stays disabled)" >&2
          fi
          echo "$SECRETS" | npx wrangler secret bulk
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SIMPLER_GRANTS_API_KEY: ${{ secrets.SIMPLER_GRANTS_API_KEY }}

      - name: Deploy agents-starter
        working-directory: agents-starter-1
        run: npm ci && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy profile matcher worker
        run: npx wrangler deploy -c workers/profile_matcher_wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set profile matcher secrets
        # Mirrors the pattern used for the main worker above.
        # Add RESEND_API_KEY as a GitHub Actions secret to enable email delivery.
        # Without it this step is a no-op and the worker logs a warning at runtime.
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "RESEND_API_KEY repo secret not set — email notifications will be skipped at runtime" >&2
            exit 0
          fi
          jq -n --arg key "$RESEND_API_KEY" '{"RESEND_API_KEY": $key}' \
            | npx wrangler secret bulk -c workers/profile_matcher_wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Create pdf-ingest queue (idempotent)
        run: npx wrangler queues create pdf-ingest || echo "Queue already exists — continuing"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Create foundationplanner-pdfs R2 bucket (idempotent)
        run: npx wrangler r2 bucket create foundationplanner-pdfs || echo "Bucket already exists — continuing"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy pdf processor worker
        # Skipped until GRANT_SUMMARIZER_URL is set as a repo secret.
        # See grant_summarizer/server.py and workers/pdf_wrangler.toml for setup.
        run: |
          if [ -z "$GRANT_SUMMARIZER_URL" ]; then
            echo "GRANT_SUMMARIZER_URL not set — skipping pdf-worker deploy" >&2
            exit 0
          fi
          npx wrangler deploy -c workers/pdf_wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GRANT_SUMMARIZER_URL: ${{ secrets.GRANT_SUMMARIZER_URL }}

      - name: Set pdf worker secrets
        run: |
          if [ -z "$GRANT_SUMMARIZER_URL" ]; then
            echo "GRANT_SUMMARIZER_URL not set — pdf worker secrets skipped" >&2
            exit 0
          fi
          jq -n --arg url "$GRANT_SUMMARIZER_URL" '{"GRANT_SUMMARIZER_URL": $url}' \
            | npx wrangler secret bulk -c workers/pdf_wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GRANT_SUMMARIZER_URL: ${{ secrets.GRANT_SUMMARIZER_URL }}
