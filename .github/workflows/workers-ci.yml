name: Cloudflare Workers CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'wrangler.toml'
      - 'ui/**'
  pull_request:
    branches: [main]
    paths:
      - 'worker.js'
      - 'wrangler.toml'
      - 'ui/**'
  workflow_dispatch:

jobs:
  # ── Build & type-check on every PR ───────────────────────────────────────
  validate:
    name: Build UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI deps
        working-directory: ui
        run: npm ci

      - name: Build UI
        working-directory: ui
        run: npm run build

  # ── Deploy only on push to main ───────────────────────────────────────────
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://grant-demo.workers.dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI deps
        working-directory: ui
        run: npm ci

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: Install root deps
        run: npm ci

      # ── Provision KV namespaces and D1 database if not yet created ────────
      # Looks up each resource by name in the target account. Creates it when
      # missing. Patches wrangler.toml in-place so the subsequent wrangler
      # commands see the correct IDs without touching the committed file.
      - name: Provision Cloudflare resources
        run: |
          # Wrangler --json wraps output in a CF API envelope: {"result":..., "success":...}
          # extract_id() unwraps either a bare value or an enveloped one.
          # We also redirect stderr to stdout so wrangler errors are visible, not swallowed.
          kv_list_ids()  { jq -r 'if type == "array" then .[] elif .result then .result[] else empty end | select(.title == $ENV.KV_TITLE) | .id'; }
          kv_create_id() { jq -r 'if .result then .result.id else .id end'; }
          d1_list_uuid() { jq -r 'if type == "array" then .[] elif .result then .result[] else empty end | select(.name == "grant-manager-db") | (.uuid // .id)'; }
          d1_create_uuid(){ jq -r 'if .result then (.result.uuid // .result.id) else (.uuid // .id) end'; }

          # ── USER_PROFILES KV ─────────────────────────────────────────────
          WORKER_NAME=$(grep '^name' wrangler.toml | head -1 | sed 's/name\s*=\s*"\(.*\)"/\1/')
          export KV_TITLE="${WORKER_NAME}-USER_PROFILES"
          UP_ID=$(npx wrangler kv namespace list --json 2>&1 \
            | kv_list_ids | head -1)
          if [ -z "$UP_ID" ]; then
            echo "Creating USER_PROFILES KV namespace..."
            UP_ID=$(npx wrangler kv namespace create USER_PROFILES --json 2>&1 \
              | kv_create_id)
          fi
          echo "USER_PROFILES id: $UP_ID"

          # ── LOGIN_ATTEMPTS KV ─────────────────────────────────────────────
          export KV_TITLE="${WORKER_NAME}-LOGIN_ATTEMPTS"
          LA_ID=$(npx wrangler kv namespace list --json 2>&1 \
            | kv_list_ids | head -1)
          if [ -z "$LA_ID" ]; then
            echo "Creating LOGIN_ATTEMPTS KV namespace..."
            LA_ID=$(npx wrangler kv namespace create LOGIN_ATTEMPTS --json 2>&1 \
              | kv_create_id)
          fi
          echo "LOGIN_ATTEMPTS id: $LA_ID"

          # ── GRANT_MANAGER_DB D1 ───────────────────────────────────────────────────
          DB_ID=$(npx wrangler d1 list --json 2>&1 \
            | d1_list_uuid | head -1)
          if [ -z "$DB_ID" ]; then
            echo "Creating grant-manager-db D1 database..."
            DB_ID=$(npx wrangler d1 create grant-manager-db --json 2>&1 \
              | d1_create_uuid)
          fi
          echo "GRANT_MANAGER_DB id: $DB_ID"

          # ── Fail early if any ID is still missing ─────────────────────────
          if [ -z "$UP_ID" ] || [ -z "$LA_ID" ] || [ -z "$DB_ID" ]; then
            echo "❌ Failed to resolve one or more resource IDs"
            exit 1
          fi

          # ── Patch wrangler.toml with this account's IDs ──────────────────
          sed -i \
            "s/id = \"3613c184af7d4890a70f1c9d28583329\"/id = \"$UP_ID\"/" \
            wrangler.toml
          sed -i \
            "s/id = \"713c8d1d9eb34d1ea13656bf40f14ccc\"/id = \"$LA_ID\"/" \
            wrangler.toml
          sed -i \
            "s/database_id = \"e99396be-8043-41f6-9762-07c2b6fc4d3f\"/database_id = \"$DB_ID\"/" \
            wrangler.toml

          echo "✅ wrangler.toml patched for this account"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_NO_BANNER: "true"

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply GRANT_MANAGER_DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
